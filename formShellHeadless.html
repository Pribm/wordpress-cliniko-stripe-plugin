<script>
  (function () {
    const ttlByKind = {
      practitioners: 5 * 60 * 1000,
      nextAvailableTimes: 15 * 1000,
    };
    const responseCache = new Map();
    const originalFetch = window.fetch.bind(window);

    function normalizeBaseUrl(raw) {
      try {
        const url = new URL(String(raw || ""), window.location.origin);
        url.hash = "";
        url.search = "";
        return url.toString();
      } catch (_) {
        return "";
      }
    }

    function getRequestToken() {
      return String(window.formHandlerData?.request_token || "").trim();
    }

    function getEndpointMap() {
      const map = new Map();
      const register = (kind, raw) => {
        const normalized = normalizeBaseUrl(raw);
        if (normalized) map.set(normalized, kind);
      };

      register("practitioners", window.formHandlerData?.practitioners_url);
      register("calendar", window.formHandlerData?.appointment_calendar_url);
      register("availableTimes", window.formHandlerData?.available_times_url);
      register("nextAvailableTimes", window.formHandlerData?.next_available_times_url);

      register("practitioners", window.ClinikoHeadlessCalendar?.endpoints?.practitioners);
      register("calendar", window.ClinikoHeadlessCalendar?.endpoints?.calendar);
      register("availableTimes", window.ClinikoHeadlessCalendar?.endpoints?.availableTimes);
      register("nextAvailableTimes", window.ClinikoHeadlessCalendar?.endpoints?.nextAvailableTimes);

      return map;
    }

    function resolveKind(url) {
      const normalized = normalizeBaseUrl(url);
      return getEndpointMap().get(normalized) || null;
    }

    function shouldCache(kind, url, method) {
      if (method !== "GET") return false;
      if (!kind) return false;
      if (kind === "calendar" || kind === "availableTimes") return false;
      if (url.searchParams.get("refresh") === "1") return false;
      if (url.searchParams.has("_ts")) return false;
      return true;
    }

    function getCacheKey(kind, url) {
      return `${kind}|${url.toString()}`;
    }

    window.fetch = async function patchedFetch(input, init = {}) {
      const requestUrl =
        typeof input === "string" || input instanceof URL
          ? new URL(String(input), window.location.origin)
          : new URL(String(input.url), window.location.origin);

      const method = String(
        init.method ||
          (typeof input === "object" && input && "method" in input ? input.method : "GET") ||
          "GET"
      ).toUpperCase();

      const kind = resolveKind(requestUrl);
      const cacheable = shouldCache(kind, requestUrl, method);

      if (cacheable) {
        const cacheKey = getCacheKey(kind, requestUrl);
        const cached = responseCache.get(cacheKey);
        if (cached && cached.expiresAt > Date.now()) {
          return cached.response.clone();
        }
        if (cached) responseCache.delete(cacheKey);
      }

      let finalInit = { ...init };

      if (kind) {
        const token = getRequestToken();
        const headers = new Headers(
          init.headers ||
            (typeof input === "object" && input && "headers" in input ? input.headers : undefined) ||
            {}
        );

        headers.set("Accept", "application/json");
        if (token) {
          headers.set("X-ES-Request-Token", token);
        }

        finalInit.headers = headers;
        if (!finalInit.credentials) {
          finalInit.credentials = "same-origin";
        }
      }

      const response = await originalFetch(input, finalInit);

      if (cacheable && response.ok) {
        const ttl = ttlByKind[kind] || 0;
        if (ttl > 0) {
          responseCache.set(getCacheKey(kind, requestUrl), {
            expiresAt: Date.now() + ttl,
            response: response.clone(),
          });
        }
      }

      return response;
    };
  })();
</script>

        const runtimeId = String(window.formHandlerData?.module_id || "").trim();
        const stateId = String(state.answers.moduleId || "").trim();
        const resolved = runtimeId || stateId;
        if (resolved && state.answers.moduleId !== resolved) {
          state.answers.moduleId = resolved;
        }
        return resolved;
      }

      function getCurrentPatientFormTemplateId() {
        const runtimeId = String(window.formHandlerData?.patient_form_template_id || "").trim();
        const stateId = String(state.answers.patient_form_template_id || "").trim();
        const resolved = runtimeId || stateId;
        if (resolved && state.answers.patient_form_template_id !== resolved) {
          state.answers.patient_form_template_id = resolved;
        }
        return resolved;
      }

      function getCurrentRequestToken() {
        return String(window.formHandlerData?.request_token || "").trim();
      }

      function buildAuthedEndpointUrl(endpoint, params = {}) {
        const base = String(endpoint || "").trim();
        if (!base) return "";

        const url = new URL(base, window.location.origin);
        Object.entries(params || {}).forEach(([key, value]) => {
          const normalized = String(value ?? "").trim();
          if (!normalized) return;
          url.searchParams.set(key, normalized);
        });

        const token = getCurrentRequestToken();
        if (token && !url.searchParams.has("request_token")) {
          url.searchParams.set("request_token", token);
        }

        return url.toString();
      }

      function syncAppointmentRuntimeModule(moduleId = "") {
        const activeModuleId = String(moduleId || "").trim();
        if (state._apptActiveModuleId === activeModuleId) {
          return activeModuleId;
        }

        state._apptActiveModuleId = activeModuleId;

        const practitionersCache = state._apptPractitionersCache;
        if (
          practitionersCache &&
          String(practitionersCache.moduleId || "").trim() !== activeModuleId
        ) {
          state._apptPractitionersCache = null;
        }

        const prewarmMeta = state._apptPrewarmMeta;
        if (
          prewarmMeta &&
          String(prewarmMeta.moduleId || "").trim() !== activeModuleId
        ) {
          state._apptPrewarmMeta = null;
          state._apptPrewarmPromise = null;
        }

        return activeModuleId;
      }

      async function fetchJsonForPrewarm(url) {
        const res = await fetch(url, {
          method: "GET",
          headers: { Accept: "application/json" },
          credentials: "same-origin",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data?.success === false) {
          throw new Error(data?.message || "Request failed.");
        }
        return data?.data ?? data ?? {};
      }

      async function fetchPractitionersForPrewarm(cal, moduleId, endpoints) {
        if (typeof cal?.fetchPractitioners === "function") {
          const list = await cal.fetchPractitioners({ appointmentTypeId: moduleId });
          return Array.isArray(list) ? list : [];
        }

        if (!endpoints.practitioners) return [];

        const url = buildAuthedEndpointUrl(endpoints.practitioners, {
          appointment_type_id: moduleId,
        });
        const payload = await fetchJsonForPrewarm(url);
        return Array.isArray(payload.practitioners) ? payload.practitioners : [];
      }

      async function prewarmAppointmentCalendar() {
        const moduleId = syncAppointmentRuntimeModule(getCurrentModuleId());
        if (!moduleId) return false;

        const cal = window.ClinikoHeadlessCalendar || {};
        const endpoints = {
          practitioners: cal?.endpoints?.practitioners || window.formHandlerData?.practitioners_url || "",
        };

        const practitioners = await fetchPractitionersForPrewarm(cal, moduleId, endpoints);
        if (!Array.isArray(practitioners) || practitioners.length === 0) return false;

        state._apptPractitionersCache = {
          moduleId,
          data: practitioners,
          expiresAt: Date.now() + APPT_PREFETCH_TTL.practitioners,
        };

        const preferred = String(state.answers?.patient?.practitioner_id || "");
        const practitionerId = preferred || String(practitioners[0]?.id || "");
        if (!practitionerId) return false;

        if (!state.answers.patient) state.answers.patient = {};
        if (!String(state.answers.patient.practitioner_id || "").trim()) {
          state.answers.patient.practitioner_id = practitionerId;
          syncPayloadExposure();
        }

        // Live availability is intentionally not prefetched or cached.
        return true;
      }

      function scheduleAppointmentCalendarPrewarm() {
        if (!state.steps.some((step) => step.type === "appointmentSelection")) return;
        const moduleId = syncAppointmentRuntimeModule(getCurrentModuleId());
        if (!moduleId) return;
        if (
          state._apptPrewarmMeta &&
          state._apptPrewarmMeta.moduleId === moduleId &&
          state._apptPrewarmMeta.promise
        ) {
          state._apptPrewarmPromise = state._apptPrewarmMeta.promise;
          return;
        }

        const run = () => {
          const promise = prewarmAppointmentCalendar().catch(() => false);
          state._apptPrewarmMeta = { moduleId, promise };
          state._apptPrewarmPromise = promise;
        };

        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(run, { timeout: 1200 });
        } else {
          setTimeout(run, 120);
        }
      }

      scheduleAppointmentCalendarPrewarm();

      function isNextAvailableMode() {
        return state.appointmentMode === "next_available";
      }

      function extractDateFromIso(iso) {
        const raw = String(iso || "").trim();
        if (!raw) return "";
        const m = raw.match(/^(\d{4}-\d{2}-\d{2})/);
        if (m) return m[1];
        const dt = new Date(raw);
        if (Number.isNaN(dt.getTime())) return "";
        const y = dt.getFullYear();
        const mo = String(dt.getMonth() + 1).padStart(2, "0");
        const d = String(dt.getDate()).padStart(2, "0");
        return `${y}-${mo}-${d}`;
      }

      function sortNextAvailableItemsClosestFirst(list) {
        return (Array.isArray(list) ? list : [])
          .slice()
          .sort((a, b) => {
            const aIso = String(a?.appointment_start || a?.appointmentStart || "");
            const bIso = String(b?.appointment_start || b?.appointmentStart || "");
            if (!aIso && !bIso) return 0;
            if (!aIso) return 1;
            if (!bIso) return -1;
            const aTs = new Date(aIso).getTime();
            const bTs = new Date(bIso).getTime();
            const aBad = Number.isNaN(aTs);
            const bBad = Number.isNaN(bTs);
            if (aBad && bBad) return 0;
            if (aBad) return 1;
            if (bBad) return -1;
            return aTs - bTs;
          });
      }

      async function fetchNextAvailableList({ forceRefresh = false } = {}) {
        const moduleId = syncAppointmentRuntimeModule(getCurrentModuleId());
        if (!moduleId) {
          throw new Error("Missing moduleId for next-available scheduling.");
        }

        const cal = window.ClinikoHeadlessCalendar || {};
        if (typeof cal.fetchNextAvailableTimes === "function") {
          const list = await cal.fetchNextAvailableTimes({
            appointmentTypeId: moduleId,
            includeUnavailable: false,
            refreshPractitioners: !!forceRefresh,
          });
          return sortNextAvailableItemsClosestFirst(list);
        }

        const endpoint =
          cal?.endpoints?.nextAvailableTimes ||
          window.formHandlerData?.next_available_times_url ||
          "";
        if (!endpoint) {
          throw new Error("Missing next-available-times endpoint.");
        }

        const url = buildAuthedEndpointUrl(endpoint, {
          appointment_type_id: moduleId,
          refresh: forceRefresh ? "1" : "",
          _ts: Date.now(),
        });

        const payload = await fetchJsonForPrewarm(url);
        const list = Array.isArray(payload?.next_available_times)
          ? payload.next_available_times
          : [];
        const filtered = list.filter((item) => {
          const iso = String(item?.appointment_start || item?.appointmentStart || "");
          const pid = String(item?.practitioner_id || item?.practitionerId || "");
          return !!iso && !!pid;
        });
        return sortNextAvailableItemsClosestFirst(filtered);
      }

      function applyAutoNextAvailableSelection(item) {
        const practitionerId = String(item?.practitioner_id || item?.practitionerId || "").trim();
        const appointmentStart = String(item?.appointment_start || item?.appointmentStart || "").trim();
        const appointmentDate = extractDateFromIso(appointmentStart);
        if (!practitionerId || !appointmentStart) return false;

        if (!state.answers.patient || typeof state.answers.patient !== "object") {
          state.answers.patient = {};
        }

        state.answers.patient.practitioner_id = practitionerId;
        state.answers.patient.appointment_start = appointmentStart;
        state.answers.patient.appointment_date = appointmentDate;
        syncPayloadExposure();
        return true;
      }

      async function ensureAutoNextAvailableSelection({
        forceRefresh = false,
        silent = false,
      } = {}) {
        if (!isNextAvailableMode()) return true;

        const meta = state._nextAvailableAuto || {};
        if (meta.status === "pending" && meta.promise && !forceRefresh) {
          return !!(await meta.promise);
        }

        if (!forceRefresh && meta.status === "ready") {
          return true;
        }

        meta.status = "pending";
        meta.error = null;

        meta.promise = (async () => {
          try {
            const list = await fetchNextAvailableList({ forceRefresh });
            const selected = list[0] || null;
            if (!selected || !applyAutoNextAvailableSelection(selected)) {
              throw new Error("No next available appointment was returned.");
            }
            meta.status = "ready";
            meta.value = selected;
            meta.error = null;
            return true;
          } catch (err) {
            meta.status = "error";
            meta.value = null;
            meta.error = err;
            if (!silent) {
              console.error("[ES Headless] Failed to resolve next available appointment.", err);
            }
            return false;
          } finally {
            meta.promise = null;
          }
        })();

        state._nextAvailableAuto = meta;
        return !!(await meta.promise);
      }

      function scheduleAutoNextAvailablePrefetch() {
        if (!isNextAvailableMode()) return;

        const run = () => {
          void ensureAutoNextAvailableSelection({ forceRefresh: true, silent: true });
        };

        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(run, { timeout: 1200 });
        } else {
          setTimeout(run, 120);
        }
      }

      scheduleAutoNextAvailablePrefetch();

      function installNextAvailableSubmitGuard() {
        if (!isNextAvailableMode()) return;
        if (window.__esNextAvailableSubmitGuardInstalled) return;

        const tryInstall = () => {
          if (window.__esNextAvailableSubmitGuardInstalled) return true;
          if (typeof window.submitBookingForm !== "function") return false;

          const original = window.submitBookingForm;
          const wrapped = async function (...args) {
            const ok = await ensureAutoNextAvailableSelection({ forceRefresh: true, silent: false });
            if (!ok) {
              const detail =
                state._nextAvailableAuto?.error?.message ||
                "Unable to auto-select next available time.";
              const errorEl = args[1];
              if (errorEl && typeof errorEl === "object" && "textContent" in errorEl) {
                errorEl.textContent = detail;
              } else {
                alert(detail);
              }
              return;
            }
            syncPayloadExposure();
            return original.apply(this, args);
          };

          window.submitBookingForm = wrapped;
          window.__esNextAvailableSubmitGuardInstalled = true;
          return true;
        };

        if (tryInstall()) return;

        let attempts = 0;
        const timer = setInterval(() => {
          attempts += 1;
          if (tryInstall() || attempts > 80) {
            clearInterval(timer);
          }
        }, 250);
      }

      installNextAvailableSubmitGuard();

      function triggerConditionals() {
        if (typeof window.ES_SHELL_CONDITIONALS_APPLY === "function") {
          window.ES_SHELL_CONDITIONALS_APPLY();
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function stripHtml(html) {
        const tmp = document.createElement("div");
        tmp.innerHTML = String(html || "");
        return (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
      }

      function looksLikeHtml(str) {
        const s = String(str || "");
        // quick heuristic: any tag-like pattern
        return /<\/?[a-z][\s\S]*>/i.test(s);
      }

      function sanitizeHtmlBasic(html) {
        const tpl = document.createElement("template");
        tpl.innerHTML = String(html || "");

        // Remove dangerous nodes
        tpl.content.querySelectorAll("script, iframe, object, embed, link, meta").forEach((n) => n.remove());

        // Remove inline JS handlers + javascript: URLs
        tpl.content.querySelectorAll("*").forEach((el) => {
          // remove on* handlers
          [...el.attributes].forEach((attr) => {
            const name = attr.name.toLowerCase();
            const val = String(attr.value || "");

            if (name.startsWith("on")) el.removeAttribute(attr.name);

            // block javascript: in href/src
            if ((name === "href" || name === "src") && /^\s*javascript:/i.test(val)) {
              el.removeAttribute(attr.name);
            }
          });
        });

        return tpl.innerHTML;
      }


      function safeText(s) {
        return String(s || "").replace(/\s+\*/g, "").replace(/\s+/g, " ").trim();
      }

      function onlyDigits(s) {
        return String(s || "").replace(/\D+/g, "");
      }

      function setShellHeaderTitle(title) {
        const el = ui.shellWrap?.querySelector?.(".es-headIntro__title");
        if (el) el.textContent = title || "";
      }

      function applyCurrentStepData(step) {
        const stepKey = String(step?.key || "");
        const stepType = String(step?.type || "");
        const stepToken = stepKey || stepType || "";
        const stepIndex = String(state.index);
        const stepNumber = String(state.index + 1);
        const stepCount = String(state.steps.length || 0);

        const applyTo = (el) => {
          if (!el?.dataset) return;
          el.dataset.esStep = stepToken;
          el.dataset.esStepKey = stepKey;
          el.dataset.esStepType = stepType;
          el.dataset.esStepIndex = stepIndex;
          el.dataset.esStepNumber = stepNumber;
          el.dataset.esStepCount = stepCount;
        };

        applyTo(ui.shellWrap);
        applyTo(ui.root);
      }

      function scrollStepRootToTop(forceWindow = false) {
        const behavior = prefersReducedMotion ? "auto" : "smooth";
        const isDesktopViewport =
          window.matchMedia && window.matchMedia("(min-width: 641px)").matches;

        if (forceWindow || isDesktopViewport) {
          window.scrollTo({ top: 0, left: 0, behavior });
          return;
        }

        const classStepRoot = document.querySelector(".es-stepRoot");
        if (classStepRoot) classStepRoot.scrollTop = 0;

        if (ui?.root) {
          if (typeof ui.root.scrollTo === "function") {
            ui.root.scrollTo({ top: 0, left: 0, behavior });
          } else {
            ui.root.scrollTop = 0;
          }
        }

        if (ui?.shellWrap) {
          if (typeof ui.shellWrap.scrollTo === "function") {
            ui.shellWrap.scrollTo({ top: 0, left: 0, behavior });
          } else {
            ui.shellWrap.scrollTop = 0;
          }
        }

        window.scrollTo({ top: 0, left: 0, behavior });
      }

      function setProgress(i, total) {
        const pct = total <= 1 ? 100 : Math.round((i / (total - 1)) * 100);
        if (ui.pPct) ui.pPct.textContent = `${pct}%`;
        if (ui.pBar) ui.pBar.style.width = `${pct}%`;
        if (ui.pTrack) ui.pTrack.setAttribute("aria-valuenow", String(pct));

        const pPctMobile = document.getElementById("esProgressPctMobile");
        const pBarMobile = document.getElementById("esProgressBarMobile");
        const pTrackMobile = document.querySelector(".es-progress__track--mobile");
        if (pPctMobile) pPctMobile.textContent = `${pct}%`;
        if (pBarMobile) pBarMobile.style.width = `${pct}%`;
        if (pTrackMobile) pTrackMobile.setAttribute("aria-valuenow", String(pct));
      }

      function isValidDateYmd(v) {
        if (!YMD_RE.test(v)) return false;
        const [y, m, d] = v.split("-").map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d));
        return (
          dt.getUTCFullYear() === y &&
          dt.getUTCMonth() + 1 === m &&
          dt.getUTCDate() === d
        );
      }

      function ymdToDisplayDob(ymd) {
        if (!isValidDateYmd(String(ymd || ""))) return "";
        const [y, m, d] = ymd.split("-");
        return `${d}/${m}/${y}`;
      }

      function formatDobInput(value) {
        const v = String(value || "").trim();
        if (!v) return "";

        // Backend/Cliniko value -> fixed UI format.
        if (YMD_RE.test(v) && isValidDateYmd(v)) {
          return ymdToDisplayDob(v);
        }

        // User-facing DOB is always DD/MM/YYYY on every browser/device.
        const digits = onlyDigits(v).slice(0, 8);
        if (!digits) return "";
        if (digits.length <= 2) return digits;
        if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
        return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
      }

      function displayDobToYmd(value) {
        const v = String(value || "").trim();
        if (!v) return "";

        if (YMD_RE.test(v) && isValidDateYmd(v)) return v;

        // UI format: DD/MM/YYYY.
        const slash = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (slash) {
          const day = String(slash[1]).padStart(2, "0");
          const month = String(slash[2]).padStart(2, "0");
          const out = `${slash[3]}-${month}-${day}`;
          return isValidDateYmd(out) ? out : "";
        }

        const dash = v.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
        if (dash) {
          const day = String(dash[1]).padStart(2, "0");
          const month = String(dash[2]).padStart(2, "0");
          const out = `${dash[3]}-${month}-${day}`;
          return isValidDateYmd(out) ? out : "";
        }

        const compact = onlyDigits(v);
        if (compact.length === 8) {
          const out = `${compact.slice(4, 8)}-${compact.slice(2, 4)}-${compact.slice(0, 2)}`;
          return isValidDateYmd(out) ? out : "";
        }

        return "";
      }

      function normalizeDateYmd(input) {
        const v = String(input || "").trim();
        if (!v) return "";
        if (YMD_RE.test(v) && isValidDateYmd(v)) return v;
        return displayDobToYmd(v);
      }

      function parseLegacySelectedValues(question) {
        const selected = new Set();

        if (question?.type === "radiobuttons" && typeof question?.answer === "string") {
          const v = safeText(question.answer);
          if (v) selected.add(v);
        }

        if (question?.type === "checkboxes" && Array.isArray(question?.answer)) {
          question.answer.forEach((item) => {
            const v = safeText(item);
            if (v) selected.add(v);
          });
        }

        return selected;
      }

      function normalizeOptionAnswers(list, selectedSet) {
        return (Array.isArray(list) ? list : [])
          .map((a) => {
            const value = safeText(a?.value || "");
            if (!value) return null;
            const isSelected = !!a?.selected || (selectedSet && selectedSet.has(value));
            return { value, selected: isSelected };
          })
          .filter(Boolean);
      }

      function normalizeTemplateToAnswers(tplObj) {
        const out = {
          patient: { ...(tplObj.patient || {}) },
          content: { sections: [] },
          moduleId: String(
            tplObj.moduleId ||
            tplObj.module_id ||
            window.formHandlerData?.module_id ||
            ""
          ),
          patient_form_template_id: String(
            tplObj.patient_form_template_id ||
            window.formHandlerData?.patient_form_template_id ||
            ""
          ),
        };

        out.patient.date_of_birth = normalizeDateYmd(out.patient.date_of_birth || "");
        out.patient.medicare_mode = normalizeMedicareMode(out.patient.medicare_mode, out.patient);

        out.content.sections = (tplObj?.content?.sections || []).map((sec) => {
          const questions = Array.isArray(sec.questions) ? sec.questions : [];

          return {
            name: sec.name || "",
            description: sec.description || "",
            questions: questions
              .map((q) => {
                const base = {
                  name: q.name || "",
                  type: q.type || "text",
                  required: !!q.required,
                };

                if (base.type === "signature") return null;

                if (base.type === "checkboxes" || base.type === "radiobuttons") {
                  const legacySelected = parseLegacySelectedValues(q);
                  const answers = normalizeOptionAnswers(q.answers, legacySelected);

                  const item = { ...base, answers };

                  if (q?.other?.enabled) {
                    item.other = {
                      enabled: true,
                      selected: !!q.other.selected,
                      value: String(q.other.value || ""),
                    };
                  }

                  return item;
                }

                return { ...base, answer: String(q.answer || "") };
              })
              .filter(Boolean),
          };
        });

        return out;
      }

      function normalizePatientForBackend(patient) {
        const p = { ...(patient || {}) };

        if ("first_name" in p) p.first_name = String(p.first_name || "").trim();
        if ("last_name" in p) p.last_name = String(p.last_name || "").trim();
        if ("email" in p) p.email = String(p.email || "").trim();
        if ("medicare_mode" in p) p.medicare_mode = normalizeMedicareMode(p.medicare_mode, p);

        if ("medicare" in p) p.medicare = onlyDigits(p.medicare).slice(0, 10);

        if ("medicare_reference_number" in p) {
          p.medicare_reference_number = onlyDigits(p.medicare_reference_number).slice(0, 1);
        }

        if ("medicare_provider" in p) {
          p.medicare_provider = String(p.medicare_provider || "").trim();
        }

        if ("health_identifier_number" in p) {
          p.health_identifier_number = formatHealthIdentifierNumber(p.health_identifier_number);
        }

        if ("phone" in p) {
          let d = onlyDigits(p.phone);
          if (d.startsWith("61")) d = "0" + d.slice(2);
          p.phone = d.slice(0, 10);
        }

        if (!Object.prototype.hasOwnProperty.call(p, "post_code")) {
          const aliasValue =
            p.postal_code ??
            p.postcode ??
            "";
          if (String(aliasValue || "").trim()) {
            p.post_code = aliasValue;
          }
        }

        if ("post_code" in p) {
          const d = onlyDigits(p.post_code);
          p.post_code = d ? d.slice(0, 4) : String(p.post_code || "").trim();
        }

        if ("postcode" in p) delete p.postcode;
        if ("postal_code" in p) delete p.postal_code;

        if ("date_of_birth" in p) {
          p.date_of_birth = normalizeDateYmd(p.date_of_birth);
        }

        if ("practitioner_id" in p) p.practitioner_id = String(p.practitioner_id || "").trim();
        if ("appointment_start" in p) p.appointment_start = String(p.appointment_start || "").trim();
        if ("appointment_date" in p) p.appointment_date = String(p.appointment_date || "").trim();

        return p;
      }

      function serializeOptionQuestion(q) {
        const answers = (Array.isArray(q.answers) ? q.answers : [])
          .map((a) => {
            const value = safeText(a?.value || "");
            if (!value) return null;
            return { value, selected: !!a?.selected };
          })
          .filter(Boolean);

        const question = {
          name: q.name,
          type: q.type,
          required: !!q.required,
          answers,
        };

        if (q?.other?.enabled) {
          question.other = q.other.selected
            ? {
              enabled: true,
              selected: true,
              value: String(q.other.value || "").trim(),
            }
            : { enabled: true };
        }

        return question;
      }

      function normalizeHeadlessFieldPathKey(path) {
        const raw = String(path || "").trim();
        if (!raw) return "";

        return normalizeLookupKey(raw.replace(/^patient\./i, ""));
      }

      function getHeadlessPatientFieldDefinitions() {
        const overrideKeys = new Set([
          normalizeLookupKey("medicare_provider"),
          normalizeLookupKey("health_identifier_number"),
        ]);

        let existing = Array.isArray(state.tpl?.headless_patient_fields)
          ? deepClone(state.tpl.headless_patient_fields)
          : [];

        existing = existing.filter((field) => {
          const pathKey = normalizeHeadlessFieldPathKey(field?.path || field?.field_path || "");
          const fieldKey = normalizeLookupKey(
            field?.key || field?.field_key || field?.label || field?.field_label || ""
          );

          return true;

            key: "medicare_provider",
            field_key: "medicare_provider",

            field_label: "Medicare provider",
            path: "medicare_provider",

          },

        const seenPaths = new Set(
          existing.map((field) => normalizeHeadlessFieldPathKey(field?.path || field?.field_path || ""))
        );

        fallbackFields.forEach((field) => {
          const pathKey = normalizeHeadlessFieldPathKey(field.path || field.field_path || "");
          if (!pathKey || seenPaths.has(pathKey)) {

                const empty = document.createElement("span");
                empty.className = "appointment-day-times__empty";
                empty.textContent = "No times";
                container.appendChild(empty);
                return;
              }

              list
                .slice()
                .sort((a, b) => {
                  // sort by time label (HH:MM)
                  return String(a.label).localeCompare(String(b.label));
                })
                .forEach(({ label, count, items }) => {
                  const btn = document.createElement("button");
                  btn.type = "button";
                  btn.className = "appointment-time-slot";
                  btn.dataset.timeLabel = label;

                  const text = document.createElement("span");
                  text.textContent = label;

                  const badge = document.createElement("span");
                  badge.className = "es-slotBadge";
                  badge.textContent = `${count} slot${count > 1 ? "s" : ""}`;

                  btn.appendChild(text);
                  btn.appendChild(badge);

                  // selected state (by ISO)
                  const isSelected = items.some((x) => String(x.iso) === selectedIso);
                  if (isSelected) btn.classList.add("is-selected");

                  btn.addEventListener("click", () => {
                    card
                      .querySelectorAll(".appointment-time-slot.is-selected")
                      .forEach((b) => b.classList.remove("is-selected"));
                    btn.classList.add("is-selected");

                    // Pick any available practitioner for that time (Option A)
                    const pick = items[0];
                    state.answers.patient.appointment_start = String(pick.iso || "");
                    state.answers.patient.practitioner_id = String(pick.practitionerId || "");
                    syncPayloadExposure();
                  });

                  container.appendChild(btn);
                });
            }

            renderBucket(timesMorning, buckets.morning);
            renderBucket(timesAfternoon, buckets.afternoon);
            renderBucket(timesEvening, buckets.evening);

            setHelp(timesHelp, "Select a time below to continue.");
          }

          async function loadAggregatedTimesForDay(dateKey) {
            try {
              if (!dateKey) return;

              if (timesLabel) timesLabel.textContent = `Available times (${dateKey})`;
              setHelp(timesHelp, "Loading available times...");
              clearTimeSlots();
              setTimesPlaceholderVisible(false);
              setTimesEmptyVisible(false);
              setTimesLoading(true, "Loading available times...");
              if (isMobile()) showPanel("times");

              const practitionerId = String(selectedPractitionerId || "").trim();
              if (!practitionerId) {
                renderGroupedTimesWithSlots({});
                return;
              }

              // Pull times directly for the selected practitioner.
              const results = await Promise.allSettled(
                [practitionerId].map(async (pid) => {
                  const list = await fetchAvailableTimesForPractitioner(pid, dateKey);
                  return list.map((t) => {
                    const iso = typeof t === "string" ? t : String(t?.appointment_start || "");
                    return { iso, practitionerId: pid };
                  }).filter((x) => !!x.iso);
                })
              );

              // Group by HH:MM label
              const grouped = {}; // label -> [{iso, practitionerId}, ...]
              results.forEach((r) => {
                if (r.status !== "fulfilled") return;
                (r.value || []).forEach((item) => {
                  const label = isoToLocalLabel(item.iso);
                  if (!label) return;
                  if (!grouped[label]) grouped[label] = [];
                  grouped[label].push(item);
                });
              });

              renderGroupedTimesWithSlots(grouped);
            } catch (err) {
              console.error("Failed to load aggregated times:", err);
              setHelp(timesHelp, "Could not fetch times. Check console/network.");
              clearTimeSlots();
              setTimesPlaceholderVisible(false);
              setTimesEmptyVisible(true, "Failed to load times.");
            } finally {
              setTimesLoading(false);
            }
          }

          async function loadAggregatedCalendarMonth(monthKey = null, options = {}) {
            const activeModuleId = getActiveModuleId();
            const requestedMonth = String(monthKey || currentMonthKey || "");
            const requestedPractitionerId = String(selectedPractitionerId || "").trim();
            const loadSequence = ++calendarLoadSequence;
            const hasCalendarSource =
              typeof cal?.fetchCalendar === "function" ||
              !!cal?.endpoints?.calendar ||
              !!window.formHandlerData?.appointment_calendar_url;
            console.info("[ES Headless] Calendar load started", {
              practitionerId: requestedPractitionerId,
              month: requestedMonth,
              moduleId: activeModuleId,
              hasCalendarSource,
              forceRefresh: options?.forceRefresh === true,
              reason: options?.reason || "calendar-load",
            });
            if (!hasCalendarSource || !activeModuleId) {
              console.warn("[ES Headless] Calendar load skipped", {
                practitionerId: selectedPractitionerId,
                month: String(monthKey || currentMonthKey || ""),
                moduleId: activeModuleId,
                hasCalendarSource,
              });
              setLoadingCalendar("Calendar unavailable");
              setHelp(calHelp, "Missing calendar endpoint or moduleId.");
              return;
            }

            try {
              setHelp(calHelp, "");
              setLoadingCalendar("Loading calendar...");
              grid.classList.add("is-loading");
              grid.setAttribute("aria-busy", "true");

              // reset selection
              state.answers.patient.appointment_date = "";
              state.answers.patient.appointment_start = "";
              state.answers.patient.practitioner_id = selectedPractitionerId;
              syncPayloadExposure();

              clearTimesUI("Select a date first");
              if (isMobile()) showPanel("calendar");

              const data = await fetchAggregatedCalendar(requestedMonth, options);

              // Ignore a slower response after the user has already selected
              // another practitioner or month.
              if (
                loadSequence !== calendarLoadSequence ||
                requestedPractitionerId !== String(selectedPractitionerId || "").trim()
              ) {
                console.info("[ES Headless] Stale calendar response ignored", {
                  practitionerId: requestedPractitionerId,
                  month: requestedMonth,
                });
                return;
              }

              if (monthLabel) monthLabel.textContent = data.month_label || "Select a date";
              renderCalendarGridMarkup(data.grid_html || "");
              currentMonthKey = String(data.month_key || monthKey || currentMonthKey || "");
              updateCalendarNavState();

              const days = grid.querySelectorAll(".calendar-day");
              days.forEach((day) => {
                const isDisabled =
                  day.classList.contains("is-disabled") ||
                  day.getAttribute("aria-disabled") === "true";
                if (isDisabled) return;

                day.style.cursor = "pointer";
                day.addEventListener("click", async () => {
                  days.forEach((d) => d.classList.remove("is-selected"));
                  day.classList.add("is-selected");

                  const dateKey = day.dataset.date || "";
                  state.answers.patient.appointment_date = dateKey;
                  state.answers.patient.appointment_start = "";
                  state.answers.patient.practitioner_id = selectedPractitionerId;
                  syncPayloadExposure();

                  await loadAggregatedTimesForDay(dateKey);
                });
              });

              if (selectFirstAvailableDateAfterReload) {
                selectFirstAvailableDateAfterReload = false;
                const firstAvailableDay = Array.from(days).find((day) => {
                  return !day.classList.contains("is-blank") &&
                    !day.classList.contains("is-disabled") &&
                    day.getAttribute("aria-disabled") !== "true";
                });

                if (firstAvailableDay) {
                  days.forEach((day) => day.classList.remove("is-selected"));
                  firstAvailableDay.classList.add("is-selected");

                  const firstDateKey = firstAvailableDay.dataset.date || "";
                  state.answers.patient.appointment_date = firstDateKey;
                  state.answers.patient.appointment_start = "";
                  state.answers.patient.practitioner_id = selectedPractitionerId;
                  syncPayloadExposure();

                  // Do not hold the calendar loader open while the selected
                  // date's times request is running.
                  void loadAggregatedTimesForDay(firstDateKey);
                }
              }

            } catch (err) {
              if (loadSequence !== calendarLoadSequence) return;
              console.error("Failed to load aggregated calendar:", err);
              setLoadingCalendar("Failed to load calendar");
              setHelp(calHelp, "Could not fetch calendar. Check console/network.");
            } finally {
              if (loadSequence === calendarLoadSequence) {
                grid.classList.remove("is-loading");
                grid.removeAttribute("aria-busy");
              }
            }
          }

          showPanel("calendar");
          updateCalendarNavState();

          window.addEventListener("resize", () => {
            if (!isMobile()) {
              if (backBtn) backBtn.classList.add("es-hidden");
            } else {
              if (state.answers.patient?.appointment_date) showPanel("times");
              else showPanel("calendar");
            }
          });

          if (backBtn) backBtn.addEventListener("click", () => showPanel("calendar"));

          function populatePractitionerSelect(practitioners) {
            if (!practitionerSelect) return;

            practitionerSelect.innerHTML = "";
            const validPractitioners = (Array.isArray(practitioners) ? practitioners : []).filter(
              (practitioner) => String(practitioner?.id || "").trim()
            );

            if (!selectedPractitionerId && validPractitioners.length) {
              selectedPractitionerId = String(validPractitioners[0].id).trim();
            }

            validPractitioners.forEach((practitioner) => {
              const id = String(practitioner?.id || "").trim();
              if (!id) return;

              const option = document.createElement("option");
              option.value = id;
              option.textContent = String(practitioner?.name || practitioner?.label || id);
              practitionerSelect.appendChild(option);
            });

            practitionerSelect.value = selectedPractitionerId;
            practitionerSelect.disabled = practitionerSelect.options.length === 0;

            if (selectedPractitionerId) {
              state.answers.patient.practitioner_id = selectedPractitionerId;
              syncPayloadExposure();
            }
          }

          if (practitionerSelect) {
            practitionerSelect.addEventListener("change", async () => {
              selectedPractitionerId = String(practitionerSelect.value || "").trim();
              if (!selectedPractitionerId) return;

              console.info("[ES Headless] Practitioner changed", {
                practitionerId: selectedPractitionerId,
                month: currentMonthKey,
              });

              state.answers.patient.appointment_date = "";
              state.answers.patient.appointment_start = "";
              state.answers.patient.practitioner_id = selectedPractitionerId;
              syncPayloadExposure();
              clearTimesUI("Select a date first");
              selectFirstAvailableDateAfterReload = true;
              showPanel("calendar");
              await loadAggregatedCalendarMonth(currentMonthKey, {
                forceRefresh: true,
                reason: "practitioner-change",
              });
            });
          }

          if (calPrevBtn) {
            calPrevBtn.addEventListener("click", async (event) => {
              event.preventDefault();
              if (calPrevBtn.disabled) return;
              const targetKey = shiftMonthKey(currentMonthKey, -1);
              if (!targetKey) return;

              console.info("[ES Headless] Calendar month changed", {
                direction: "previous",
                practitionerId: selectedPractitionerId,
                month: targetKey,
              });

              state.answers.patient.appointment_date = "";
              state.answers.patient.appointment_start = "";
              state.answers.patient.practitioner_id = selectedPractitionerId;
              syncPayloadExposure();
              clearTimesUI("Select a date first");
              if (isMobile()) showPanel("calendar");

              await loadAggregatedCalendarMonth(targetKey, {
                forceRefresh: true,
                reason: "previous-month",
              });
            });
          }

          if (calNextBtn) {
            calNextBtn.addEventListener("click", async (event) => {
              event.preventDefault();
              const targetKey = shiftMonthKey(currentMonthKey, 1);
              if (!targetKey) return;

              console.info("[ES Headless] Calendar month changed", {
                direction: "next",
                practitionerId: selectedPractitionerId,
                month: targetKey,
              });

              state.answers.patient.appointment_date = "";
              state.answers.patient.appointment_start = "";
              state.answers.patient.practitioner_id = selectedPractitionerId;
              syncPayloadExposure();
              clearTimesUI("Select a date first");
              if (isMobile()) showPanel("calendar");

              await loadAggregatedCalendarMonth(targetKey, {
                forceRefresh: true,
                reason: "next-month",
              });
            });
          }

          // Validate prerequisites
          const hasPractitionerSource =
            !!readPractitionersCache(getActiveModuleId()) ||
            typeof cal?.fetchPractitioners === "function" ||
            !!cal?.endpoints?.practitioners ||
            !!window.formHandlerData?.practitioners_url;

          if (!getActiveModuleId() || !hasPractitionerSource) {
            setLoadingCalendar("Calendar unavailable");
            setHelp(calHelp, "ClinikoHeadlessCalendar or moduleId not available.");
            clearTimesUI("Times unavailable");
            return;
          }

          // initial load
          try {
            // Ensure practitioners list is reachable (also warms cache)
            const list = await fetchPractitionersList();
            if (!Array.isArray(list) || !list.length) {
              setLoadingCalendar("No practitioners available");
              setHelp(calHelp, "No practitioners returned for this appointment type.");
              clearTimesUI("No times");
              return;
            }

            populatePractitionerSelect(list);

            await loadAggregatedCalendarMonth(currentMonthKey);
          } catch (err) {
            console.error("Failed to init aggregated calendar:", err);
            setLoadingCalendar("Calendar unavailable");
            setHelp(calHelp, "Could not initialize aggregated calendar. Check console/network.");
            clearTimesUI("Times unavailable");
          }
        }, 0);

        return card;
      }

      function renderOtherInputField(q) {
        if (!q?.other?.enabled || !q?.other?.selected) return null;

        const wrap = document.createElement("div");
        wrap.className = "es-field es-otherInputWrap";
        wrap.style.gridColumn = "1 / -1";
        wrap.style.marginTop = "4px";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "es-textInput";
        input.placeholder = "Please specify";
        input.value = String(q?.other?.value || "");
        if (q?.required) {
          input.setAttribute("required", "required");
        }

        input.addEventListener("input", () => {
          if (!q.other || typeof q.other !== "object") {
            q.other = { enabled: true, selected: true, value: "" };
          }
          q.other.value = input.value;
          syncPayloadExposure();
        });

        wrap.appendChild(input);
        return wrap;
      }

      function renderRadioCards(q) {
        const wrap = document.createElement("div");
        wrap.className = "es-options es-grid2";

        const buttons = [];
        let otherBtn = null;

        function syncOtherInput() {
          const existing = wrap.querySelector(".es-otherInputWrap");
          const shouldExist = !!(q?.other?.enabled && q?.other?.selected);

          if (shouldExist && !existing) {
            const otherInput = renderOtherInputField(q);
            if (otherInput) wrap.appendChild(otherInput);
            return;
          }

          if (!shouldExist && existing) {
            existing.remove();
          }
        }

        function syncVisualState() {
          buttons.forEach(({ btn, index }) => {
            const selected = !!q.answers?.[index]?.selected;
            btn.setAttribute("aria-pressed", String(selected));
            btn.classList.toggle("is-selected", selected);
          });

          if (otherBtn) {
            const selected = !!q?.other?.selected;
            otherBtn.setAttribute("aria-pressed", String(selected));
            otherBtn.classList.toggle("is-selected", selected);
          }

          syncOtherInput();
        }

        function finishOptionUpdate() {
          syncVisualState();
          syncPayloadExposure();

          /*
           * Do not rerender the whole step after a tap. On iOS, deleting the
           * focused/touched button can make Safari reposition the viewport.
           */
          requestAnimationFrame(triggerConditionals);
        }

        (q.answers || []).forEach((a, idx) => {
          const label = safeText(a.value);
          const checked = !!a.selected;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "es-cardOpt";
          btn.setAttribute("aria-pressed", String(checked));
          if (checked) btn.classList.add("is-selected");

          btn.innerHTML = `
          <div class="es-optIc" aria-hidden="true"><i class="fa-solid ${iconFor(label, "radio")}"></i></div>
          <div class="es-optText"><div class="es-optLabel">${escapeHtml(label)}</div></div>
        `;

          btn.addEventListener("click", () => {
            (q.answers || []).forEach((answer, i) => {
              answer.selected = i === idx;
            });

            if (q?.other?.enabled) {
              q.other.selected = false;
              q.other.value = "";
            }

            finishOptionUpdate();
          });

          buttons.push({ btn, index: idx });
          wrap.appendChild(btn);
        });

        if (q?.other?.enabled) {
          const otherSelected = !!q?.other?.selected;
          otherBtn = document.createElement("button");
          otherBtn.type = "button";
          otherBtn.className = "es-cardOpt";
          otherBtn.setAttribute("aria-pressed", String(otherSelected));
          if (otherSelected) otherBtn.classList.add("is-selected");

          otherBtn.innerHTML = `
          <div class="es-optIc" aria-hidden="true"><i class="fa-solid ${iconFor("Other", "radio")}"></i></div>
          <div class="es-optText"><div class="es-optLabel">Other</div></div>
        `;

          otherBtn.addEventListener("click", () => {
            (q.answers || []).forEach((answer) => {
              answer.selected = false;
            });

            if (!q.other || typeof q.other !== "object") {
              q.other = { enabled: true, selected: true, value: "" };
            } else {
              q.other.enabled = true;
              q.other.selected = true;
            }

            finishOptionUpdate();
          });

          wrap.appendChild(otherBtn);
          syncOtherInput();
        }

        return wrap;
      }

      function renderCheckboxCards(q) {
        const wrap = document.createElement("div");
        wrap.className = "es-options";

        const buttons = [];
        let otherBtn = null;

        function syncOtherInput() {
          const existing = wrap.querySelector(".es-otherInputWrap");
          const shouldExist = !!(q?.other?.enabled && q?.other?.selected);

          if (shouldExist && !existing) {
            const otherInput = renderOtherInputField(q);
            if (otherInput) wrap.appendChild(otherInput);
            return;
          }

          if (!shouldExist && existing) {
            existing.remove();
          }
        }

        function syncVisualState() {
          buttons.forEach(({ btn, index }) => {
            const selected = !!q.answers?.[index]?.selected;
            btn.setAttribute("aria-checked", String(selected));
            btn.classList.toggle("is-selected", selected);
          });

          if (otherBtn) {
            const selected = !!q?.other?.selected;
            otherBtn.setAttribute("aria-checked", String(selected));
            otherBtn.classList.toggle("is-selected", selected);
          }

          syncOtherInput();
        }

        function finishOptionUpdate() {
          syncVisualState();
          syncPayloadExposure();
          requestAnimationFrame(triggerConditionals);
        }

        (q.answers || []).forEach((a, idx) => {
          const label = safeText(a.value);
          const checked = !!a.selected;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "es-cardOpt";
          btn.setAttribute("aria-checked", String(checked));
          if (checked) btn.classList.add("is-selected");

          btn.innerHTML = `
          <div class="es-optIc" aria-hidden="true"><i class="fa-solid ${iconFor(label, "checkbox")}"></i></div>
          <div class="es-optText"><div class="es-optLabel">${escapeHtml(label)}</div></div>
        `;

          btn.addEventListener("click", () => {
            q.answers[idx].selected = !q.answers[idx].selected;
            finishOptionUpdate();
          });

          buttons.push({ btn, index: idx });
          wrap.appendChild(btn);
        });

        if (q?.other?.enabled) {
          const otherSelected = !!q?.other?.selected;
          otherBtn = document.createElement("button");
          otherBtn.type = "button";
          otherBtn.className = "es-cardOpt";
          otherBtn.setAttribute("aria-checked", String(otherSelected));
          if (otherSelected) otherBtn.classList.add("is-selected");

          otherBtn.innerHTML = `
          <div class="es-optIc" aria-hidden="true"><i class="fa-solid ${iconFor("Other", "checkbox")}"></i></div>
          <div class="es-optText"><div class="es-optLabel">Other</div></div>
        `;

          otherBtn.addEventListener("click", () => {
            if (!q.other || typeof q.other !== "object") {
              q.other = { enabled: true, selected: true, value: "" };
            } else {
              q.other.enabled = true;
              q.other.selected = !q.other.selected;
              if (!q.other.selected) q.other.value = "";
            }

            finishOptionUpdate();
          });

          wrap.appendChild(otherBtn);
          syncOtherInput();
        }

        return wrap;
      }

      function renderTextField(q) {
        const wrap = document.createElement("div");

        const input = document.createElement("input");

        return wrap;

      function renderTextarea(q) {
        const wrap = document.createElement("div");
        wrap.className = "es-field";

        const ta = document.createElement("textarea");
        ta.className = "es-textarea";
        ta.value = q.answer || "";

        ta.addEventListener("input", () => {
          q.answer = ta.value;

      function renderSectionStep(step) {
        const card = document.createElement("div");
        card.className = "es-stepCard";

        const body = document.createElement("div");
        body.className = "es-stepBody";

        const sec = state.answers.content.sections[step.sectionIndex];

        const descRaw = sec?.description || "";
        const descStripped = stripHtml(descRaw);

        if (descStripped) {
          const desc = document.createElement("div");
          desc.className = "es-sectionDesc";

          // If it looks like HTML, render as HTML (sanitized).
          // Otherwise render as plain text.
          if (looksLikeHtml(descRaw)) {
            desc.innerHTML = sanitizeHtmlBasic(descRaw);
          } else {
            desc.textContent = descStripped;
          }

          body.appendChild(desc);
        }


        (sec?.questions || []).forEach((q) => {
          const block = document.createElement("div");
          block.className = "inputGroup es-group";

          block.appendChild(renderGroupTitle(q.name, q.required));

          if (q.type === "radiobuttons") block.appendChild(renderRadioCards(q));
          else if (q.type === "checkboxes") block.appendChild(renderCheckboxCards(q));
          else if (q.type === "paragraph" || q.type === "textarea") block.appendChild(renderTextarea(q));
          else block.appendChild(renderTextField(q));

          body.appendChild(block);
        });

        card.appendChild(body);
        return card;
      }

      function prettifyPatientKey(k) {
        const key = String(k || "").toLowerCase();
        if (key === "address_1") return "Address";
        if (key === "address_2") return "Address continuation";
        if (key === "medicare_mode") return "Medicare status";
        if (key === "medicare") return "Medicare number";
        if (key === "medicare_reference_number") return "IRN";
        if (key === "medicare_provider") return "Provider";
        if (key === "health_identifier_number") return "Health Identifier Number (HIN)";

        return String(k || "")
          .replaceAll("_", " ")
          .replace(/\b\w/g, (m) => m.toUpperCase());
      }

      function inputTypeForPatientKey(key) {
        const k = String(key || "").toLowerCase();
        if (k.includes("email")) return "email";
        if (k.includes("phone")) return "tel";
        if (k === "date_of_birth") return "text";
        return "text";
      }

      function isPostcodeKey(key) {
        const k = String(key || "").toLowerCase();
        return k === "post_code" || k === "postcode" || k === "postal_code";
      }

      function shouldHidePatientKey(key) {
        return (
          key === "appointment_start" ||
          key === "practitioner_id" ||
          key === "appointment_date" ||
          key === "address_2"
        );
      }

      function formatPhoneAU(raw) {
        const d = onlyDigits(raw);
        if (!d) return "";
        let x = d;
        if (x.startsWith("61")) x = "0" + x.slice(2);

        if (x.startsWith("04")) {
          const a = x.slice(0, 4);
          const b = x.slice(4, 7);
          const c = x.slice(7, 10);
          return [a, b, c].filter(Boolean).join(" ").trim();
        }

        const a = x.slice(0, 2);
        const b = x.slice(2, 6);
        const c = x.slice(6, 10);
        return [a, b, c].filter(Boolean).join(" ").trim();
      }

      function formatMedicare10(raw) {
        const d = onlyDigits(raw).slice(0, 10);
        const a = d.slice(0, 4);
        const b = d.slice(4, 9);
        const c = d.slice(9, 10);
        return [a, b, c].filter(Boolean).join(" ").trim();
      }

      function formatMedicareRef(raw) {
        return onlyDigits(raw).slice(0, 1);
      }

      function formatPostcodeAU(raw) {
        return onlyDigits(raw).slice(0, 4);
      }

      function toDisplayDob(raw) {
        const ymd = normalizeDateYmd(raw);
        if (ymd) return ymdToDisplayDob(ymd);
        return formatDobInput(raw);
      }

      function toRawByKey(key, value) {
        switch (key) {
          case "phone": {
            let d = onlyDigits(value);
            if (d.startsWith("61")) d = "0" + d.slice(2);
            return d.slice(0, 10);
          }
          case "medicare":
            return onlyDigits(value).slice(0, 10);
          case "medicare_reference_number":
            return onlyDigits(value).slice(0, 1);
          case "medicare_provider":
            return String(value || "").trim();
          case "health_identifier_number":
            return formatHealthIdentifierNumber(value);
          case "post_code":
          case "postcode":
          case "postal_code":
            return onlyDigits(value).slice(0, 4);
          case "date_of_birth":
            return normalizeDateYmd(value);
          default:
            return String(value || "");
        }
      }

      function applyMaskByKey(key, value) {
        switch (key) {
          case "phone":
            return formatPhoneAU(value);
          case "medicare":
            return formatMedicare10(value);
          case "medicare_reference_number":
            return formatMedicareRef(value);
          case "medicare_provider":
            return String(value || "").trim();
          case "health_identifier_number":
            return formatHealthIdentifierNumber(value);
          case "post_code":
          case "postcode":
          case "postal_code":
            return formatPostcodeAU(value);
          case "date_of_birth":
            return formatDobInput(value);
          default:
            return value;
        }
      }

      function placeholderByKey(key) {
        switch (key) {
          case "phone":
            return "04xx xxx xxx";
          case "medicare":
            return "1234 56789 0";
          case "medicare_reference_number":
            return "0";
          case "medicare_provider":
            return "Select a provider";
          case "health_identifier_number":
            return "Enter 16-digit HIN";
          case "post_code":
          case "postcode":
          case "postal_code":
            return "4 digits";
          case "date_of_birth":
            return "DD/MM/YYYY";
          default:
            return "";
        }
      }

      function medicarePreviewNumber(patient) {
        const number = formatMedicare10(patient?.medicare || "");
        return number || "0000 00000 0";
      }

      function medicarePreviewIrn(patient) {
        const ref = formatMedicareRef(patient?.medicare_reference_number || "");
        if (ref) {
          return ref;
        }

        const medicareDigits = onlyDigits(patient?.medicare || "").slice(0, 10);
        if (medicareDigits.length === 10) {
          return medicareDigits.slice(9, 10);
        }

        return "0";
      }

      function medicarePreviewCardholderName(patient) {
        const first = String(patient?.first_name || "").trim();
        const last = String(patient?.last_name || "").trim();
        const full = `${first} ${last}`.trim();
        return full ? full.toUpperCase() : "CARDHOLDER NAME";
      }

      function medicarePreviewDob(patient) {
        const ymd = normalizeDateYmd(patient?.date_of_birth || "");
        return ymd ? ymdToDisplayDob(ymd) : "--/--/----";
      }

      function createMedicarePreview() {
        const wrap = document.createElement("div");
        wrap.className = "es-medicareHint";

          wrap.style.setProperty("--es-card-accent", rootTheme.accent);
          wrap.style.setProperty("--es-card-badge-bg", rootTheme.badgeBg);
          wrap.style.setProperty("--es-card-badge-text", rootTheme.badgeText);
          wrap.style.setProperty("--es-card-chip-bg", rootTheme.chipBg);
          wrap.style.setProperty("--es-card-chip-text", rootTheme.chipText);
          wrap.style.setProperty("--es-card-glow", rootTheme.cardGlow);
        };

        const renderMedicareCard = (patient) => {
          applyCardTheme(HEALTH_CARD_THEMES.medicare);
          wrap.innerHTML = `
          <div class="es-medicarePreview" role="presentation" aria-label="Medicare card preview">
            <span class="es-medicarePreview__logoBox">medicare</span>
            <div class="es-medicarePreview__stack">

                <span class="es-medicarePreview__value es-medicarePreview__number" data-es-medicare-number>0000 00000 0</span>
              </div>
              <div class="es-medicarePreview__field es-medicarePreview__field--name">
                <span class="es-medicarePreview__label">IRN / cardholder name</span>
                <span class="es-medicarePreview__value es-medicarePreview__value--name">
                  <span class="es-medicarePreview__irn" data-es-medicare-irn>0</span>
                  <span class="es-medicarePreview__cardholder" data-es-medicare-name-text>CARDHOLDER NAME</span>
                </span>
              </div>
            </div>
            <div class="es-medicarePreview__field es-medicarePreview__field--dob">

              <span class="es-medicarePreview__value es-medicarePreview__value--dob" data-es-medicare-dob>--/--/----</span>
            </div>
          </div>
        `;

          const numberEl = wrap.querySelector("[data-es-medicare-number]");
          const irnEl = wrap.querySelector("[data-es-medicare-irn]");
          const nameEl = wrap.querySelector("[data-es-medicare-name-text]");
          const dobEl = wrap.querySelector("[data-es-medicare-dob]");

          if (numberEl) numberEl.textContent = medicarePreviewNumber(patient);
          if (irnEl) irnEl.textContent = medicarePreviewIrn(patient);
          if (nameEl) nameEl.textContent = medicarePreviewCardholderName(patient);
          if (dobEl) dobEl.textContent = medicarePreviewDob(patient);
        };

        const renderProviderCard = (patient) => {
          const providerValue = String(patient?.medicare_provider || "").trim();
          const providerOption = getMedicareProviderOption(providerValue);
          const theme = getMedicareProviderTheme(providerValue);
          applyCardTheme(theme);

          const providerLabel = providerOption?.label || (providerValue ? providerValue : "Select a provider");
          const providerBadge = getMedicareProviderBadgeLabel(providerLabel);
          const hin = formatHealthIdentifierNumber(patient?.health_identifier_number || "") || "HIN";
          const status = providerValue && providerLabel === "Other" ? "Other provider" : "No Medicare";
          const name = medicarePreviewCardholderName(patient);

          wrap.innerHTML = `
          <div class="es-healthPreview es-healthPreview--provider" role="presentation" aria-label="Health card preview">
            <div class="es-healthPreview__grain"></div>
            <div class="es-healthPreview__top">
              <div class="es-healthPreview__brandWrap">
                <span class="es-healthPreview__brandPill">${escapeHtml(providerBadge)}</span>
                <span class="es-healthPreview__subline">${escapeHtml(providerLabel)}</span>
              </div>
              <span class="es-healthPreview__status">${escapeHtml(status)}</span>

            <div class="es-healthPreview__hero">

              </div>
            </div>
          </div>
        `;
        };

        const update = () => {
          const patient = state.answers.patient || {};
          const mode = getMedicareMode(patient);
          if (mode === MEDICARE_MODE_NONE) {
            renderProviderCard(patient);
            return;
          }

          renderMedicareCard(patient);
        };

        update();
        return { wrap, update };

        document.head.appendChild(style);
