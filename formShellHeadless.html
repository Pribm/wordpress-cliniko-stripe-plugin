      function buildPatientField(key, patient, onPatientChange = null, fieldRefs = null) {
        const field = document.createElement("div");
        field.className = `es-field es-field--${key}`;

        const inputId = `es-patient-${key}-${Math.random().toString(36).slice(2, 8)}`;

        const label = document.createElement("label");
        label.className = "es-floatLabel";
        label.setAttribute("for", inputId);
        label.textContent = prettifyPatientKey(key);

        if (key === "date_of_birth") {
          field.classList.add("es-field--nativeDate");

          // Editable visible value: always DD/MM/YYYY on every browser.
          const displayInput = document.createElement("input");
          displayInput.id = inputId;
          displayInput.type = "text";
          displayInput.className = "es-textInput es-dateDisplayInput";
          displayInput.placeholder = " ";
          displayInput.dataset.patientKey = key;
          displayInput.autocomplete = "bday";
          displayInput.inputMode = "numeric";
          displayInput.maxLength = 10;
          displayInput.setAttribute("aria-label", "Date of birth, DD/MM/YYYY");

          // Genuine native date input. It only covers the calendar-icon area,
          // leaving the visible DD/MM/YYYY field completely editable.
          const pickerInput = document.createElement("input");
          pickerInput.type = "date";
          pickerInput.className = "es-nativeDatePicker";
          pickerInput.autocomplete = "bday";
          pickerInput.setAttribute("aria-label", "Open date of birth calendar");

          const pickerIcon = document.createElement("span");
          pickerIcon.className = "es-datePickerIcon";
          pickerIcon.setAttribute("aria-hidden", "true");
          pickerIcon.innerHTML = '<i class="fa-solid fa-calendar-days"></i>';

          const initialYmd = normalizeDateYmd(patient[key] || "");
          pickerInput.value = initialYmd;
          displayInput.value = initialYmd ? ymdToDisplayDob(initialYmd) : "";

          if (REQUIRED_PATIENT_FIELDS.has(key)) {
            displayInput.setAttribute("required", "required");
            displayInput.setAttribute("aria-required", "true");
          }

          if (fieldRefs && typeof fieldRefs === "object") {
            fieldRefs[key] = displayInput;
          }

          let lastSyncedYmd = initialYmd;

          const publishDob = (ymd) => {
            const normalized = normalizeDateYmd(ymd || "");

            if (
              normalized === lastSyncedYmd &&
              String(state.answers.patient[key] || "") === normalized
            ) {
              return;
            }

            lastSyncedYmd = normalized;
            state.answers.patient[key] = normalized;
            syncPayloadExposure();
            if (typeof onPatientChange === "function") onPatientChange();
          };

          const syncDobFromDisplay = ({ normalizeDisplay = false } = {}) => {
            const masked = formatDobInput(displayInput.value);
            if (displayInput.value !== masked) {
              displayInput.value = masked;
            }

            const ymd = displayDobToYmd(masked);

            // Keep the native picker synchronized whenever the typed date is valid.
            // While the user is still typing (or the date is invalid), its value is blank.
            if (pickerInput.value !== ymd) {
              pickerInput.value = ymd;
            }

            if (normalizeDisplay && ymd) {
              displayInput.value = ymdToDisplayDob(ymd);
            }

            publishDob(ymd);
          };

          const syncDobFromPicker = () => {
            const ymd = normalizeDateYmd(pickerInput.value || "");
            displayInput.value = ymd ? ymdToDisplayDob(ymd) : "";
            publishDob(ymd);
          };

          displayInput.addEventListener("input", () => {
            syncDobFromDisplay();
          });

          displayInput.addEventListener("blur", () => {
            syncDobFromDisplay({ normalizeDisplay: true });
          });

          // On desktop Chromium/Edge, explicitly open the picker from the icon hit area.
          // Safari/iOS still falls back to the native input[type=date] click behaviour.
          pickerInput.addEventListener("pointerdown", () => {
            if (typeof pickerInput.showPicker === "function") {
              try {
                pickerInput.showPicker();
              } catch (_) {
                // Ignore and let the browser's native click behaviour handle it.
              }
            }
          });

          pickerInput.addEventListener("input", syncDobFromPicker);
          pickerInput.addEventListener("change", syncDobFromPicker);

          field.appendChild(displayInput);
          field.appendChild(label);
          field.appendChild(pickerIcon);
          field.appendChild(pickerInput);
          return field;
        }

        const input = document.createElement("input");
        input.id = inputId;
        input.type = inputTypeForPatientKey(key);
        input.className = "es-textInput";
        input.placeholder = " ";
        input.dataset.patientKey = key;

        if (key === "date_of_birth") {
          input.autocomplete = "bday";
          input.inputMode = "numeric";
          input.maxLength = 10;
          input.placeholder = "DD/MM/YYYY";
          input.setAttribute("aria-label", "Date of birth, DD/MM/YYYY");
        } else if (
          key === "phone" ||
          key === "medicare" ||
          key === "medicare_reference_number" ||
          key === "health_identifier_number" ||
          isPostcodeKey(key)
        ) {
          input.inputMode = "numeric";
        }

        if (key === "health_identifier_number") {
          input.maxLength = 16;
          input.pattern = "\\d{16}";
        }

        if (REQUIRED_PATIENT_FIELDS.has(key)) {
          input.setAttribute("required", "required");
        }

        if (fieldRefs && typeof fieldRefs === "object") {
          fieldRefs[key] = input;
        }

        input.value = applyMaskByKey(key, patient[key] || "");

        input.addEventListener("input", () => {
          if (key === "date_of_birth") {
            const masked = formatDobInput(input.value);
            if (input.value !== masked) input.value = masked;

            // Keep the payload in YYYY-MM-DD while the field shows DD/MM/YYYY.
            state.answers.patient[key] = displayDobToYmd(masked);
            syncPayloadExposure();
            if (typeof onPatientChange === "function") onPatientChange();
            return;
          }

          const raw = toRawByKey(key, input.value);
          const masked = applyMaskByKey(key, raw);
          if (input.value !== masked) input.value = masked;

          state.answers.patient[key] = raw;
          syncPayloadExposure();
          if (typeof onPatientChange === "function") onPatientChange();
        });

        input.addEventListener("blur", () => {
          if (key === "date_of_birth") {
            const ymd = displayDobToYmd(input.value);

            if (ymd) {
              input.value = ymdToDisplayDob(ymd);
            } else {
              input.value = formatDobInput(input.value);
            }

            state.answers.patient[key] = ymd;
            syncPayloadExposure();
            if (typeof onPatientChange === "function") onPatientChange();
            return;
          }

          const raw = toRawByKey(key, input.value);
          const masked = applyMaskByKey(key, raw);
          input.value = masked;

          state.answers.patient[key] = raw;
          syncPayloadExposure();
          if (typeof onPatientChange === "function") onPatientChange();
        });

        field.appendChild(input);
        field.appendChild(label);

        if (key === "health_identifier_number") {
          const helpLink = document.createElement("a");
          helpLink.className = "es-hinHelpLink";
          helpLink.href = "https://www.easyscripts.com.au/info/how-to-get-health-identifier-number";
          helpLink.target = "_blank";
          helpLink.rel = "noopener noreferrer";
          helpLink.textContent = "How to Get Your Individual Healthcare Identifier (IHI)";
          helpLink.setAttribute(
            "aria-label",
            "How to Get Your Individual Healthcare Identifier (IHI) — opens in a new tab"
          );
          field.appendChild(helpLink);
        }

        return field;
      }

      function buildSelectField(key, patient, onPatientChange = null, fieldRefs = null, opts = {}) {
        const field = document.createElement("div");
        field.className = `es-field es-field--${key} es-field--select`;

        const inputId = `es-patient-${key}-${Math.random().toString(36).slice(2, 8)}`;
        const label = document.createElement("label");
        label.className = "es-selectLabel";
        label.setAttribute("for", inputId);
        label.textContent = String(opts.label || prettifyPatientKey(key));

        const select = document.createElement("select");
        select.id = inputId;
        select.className = "es-textInput es-selectInput";
        select.dataset.patientKey = key;

        const currentValue = String(patient[key] || "").trim();
        const options = Array.isArray(opts.options) ? opts.options : [];
        const hasCurrentValue = options.some((option) => String(option?.value ?? option?.label ?? "").trim() === currentValue);

        if (!opts.hidePlaceholder) {
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = String(opts.placeholder || `Select ${String(opts.label || prettifyPatientKey(key)).toLowerCase()}`);
          placeholder.disabled = !!opts.required;
          placeholder.selected = !currentValue;
          select.appendChild(placeholder);
        }

        options.forEach((option) => {
          const opt = document.createElement("option");
          opt.value = String(option?.value ?? option?.label ?? "").trim();
          opt.textContent = String(option?.label ?? option?.value ?? "").trim();
          if (opt.value === currentValue) {
            opt.selected = true;
          }
          select.appendChild(opt);
        });

        if (currentValue && !hasCurrentValue) {
          const fallback = document.createElement("option");
          fallback.value = currentValue;
          fallback.textContent = currentValue;
          fallback.selected = true;
          select.appendChild(fallback);
        }

        if (opts.required) {
          select.setAttribute("required", "required");
        }

        if (fieldRefs && typeof fieldRefs === "object") {
          fieldRefs[key] = select;
        }

        select.value = currentValue;

        const syncValue = () => {
          state.answers.patient[key] = String(select.value || "").trim();
          syncPayloadExposure();
          if (typeof onPatientChange === "function") onPatientChange();
        };

        select.addEventListener("change", syncValue);
        select.addEventListener("input", syncValue);

        field.appendChild(label);
        field.appendChild(select);
        return field;
      }

      function renderPatientStep() {
        ensurePatientStepStyles();

        const card = document.createElement("div");
        card.className = "es-stepCard es-stepCard--patient";

        const body = document.createElement("div");
        body.className = "es-stepBody";

        const layout = document.createElement("div");
        layout.className = "es-patientLayout";

        const patient = state.answers.patient || {};
        const hidden = new Set(["appointment_start", "practitioner_id", "appointment_date", "address_2"]);

        const groups = [
          {
            key: "personal",
            title: "Personal Details",
            className: "es-patientCard--personal",
            fields: ["first_name", "last_name", "phone", "date_of_birth", "email"],
          },
          {
            key: "medicare",
            title: "Medicare",
            className: "es-patientCard--medicare",
            fields: [
              "medicare_mode",
              "medicare",
              "medicare_reference_number",
              "medicare_provider",
              "health_identifier_number",
            ],
          },
          {
            key: "address",
            title: "Address",
            className: "es-patientCard--address",
            fields: [
              "address_1",
              "city",
              "state",
              "post_code",
              "postcode",
              "postal_code",
              "country",
            ],
          },
        ];

        const configured = new Set();
        groups.forEach((g) => g.fields.forEach((f) => configured.add(f)));

        const extras = Object.keys(patient).filter((k) => {
          if (hidden.has(k) || configured.has(k)) return false;
          if (k === "custom_fields") return false;

          const value = patient[k];
          if (value && typeof value === "object") {
            return false;
          }

          return true;
        });

        const finalGroups = groups
          .map((g) => ({
            ...g,
            fields: g.fields.filter((f) => Object.prototype.hasOwnProperty.call(patient, f)),
          }))
          .filter((g) => g.fields.length > 0);

        if (extras.length > 0) {
          finalGroups.push({
            key: "other",
            title: "Additional Details",
            className: "es-patientCard--other",
            fields: extras,
          });
        }

        if (!finalGroups.length) {
          const empty = document.createElement("div");
          empty.className = "es-error";
          empty.textContent = "No patient fields available in submission template.";
          body.appendChild(empty);
          card.appendChild(body);
          return card;
        }

        let updateMedicarePreview = null;
        const patientFieldRefs = {};
        let medicareModeSwitchInput = null;
        let medicareHaveFieldsWrap = null;
        let medicareAlternativeFieldsWrap = null;

        const handlePatientFieldChange = () => {
          if (typeof updateMedicarePreview === "function") {
            updateMedicarePreview();
          }
        };

        const syncMedicareModeUI = () => {
          const current = state.answers.patient || {};
          const mode = getMedicareMode(current);

          if (medicareModeSwitchInput) {
            medicareModeSwitchInput.checked = mode === MEDICARE_MODE_NONE;
            medicareModeSwitchInput.setAttribute("aria-checked", String(mode === MEDICARE_MODE_NONE));
          }

          if (medicareHaveFieldsWrap) {
            medicareHaveFieldsWrap.style.display =
              mode === MEDICARE_MODE_NONE ? "none" : "grid";
          }

          if (medicareAlternativeFieldsWrap) {
            medicareAlternativeFieldsWrap.style.display =
              mode === MEDICARE_MODE_NONE ? "grid" : "none";
          }

          if (typeof updateMedicarePreview === "function") {
            updateMedicarePreview();
          }
        };

        const setMedicareMode = (nextMode, opts = {}) => {
          const normalized = normalizeMedicareMode(nextMode, state.answers.patient || {});
          if (!state.answers.patient || typeof state.answers.patient !== "object") {
            state.answers.patient = {};
          }

          state.answers.patient.medicare_mode = normalized;

          if (normalized === MEDICARE_MODE_NONE) {
            state.answers.patient.medicare = "";
            state.answers.patient.medicare_reference_number = "";
          } else {
            state.answers.patient.medicare_provider = "";
            state.answers.patient.health_identifier_number = "";
          }

          syncPayloadExposure();
          syncMedicareModeUI();
          if (typeof handlePatientFieldChange === "function") {
            handlePatientFieldChange();
          }

          if (opts.focus !== false) {
            requestAnimationFrame(() => {
              const target =
                normalized === MEDICARE_MODE_NONE
                  ? patientFieldRefs.medicare_provider
                  : patientFieldRefs.medicare;
              if (target && typeof target.focus === "function") {
                target.focus();
              }
            });
          }
        };

        finalGroups.forEach((group) => {
          const groupCard = document.createElement("section");
          groupCard.className = `es-patientCard ${group.className}`;

          const title = document.createElement("h4");
          title.className = "es-patientCardTitle";
          title.textContent = group.title;

          const fieldsWrap = document.createElement("div");
          fieldsWrap.className = "es-patientFields";

          if (group.key !== "medicare") {
            group.fields.forEach((key) => {
              if (hidden.has(key)) return;
              fieldsWrap.appendChild(
                buildPatientField(key, patient, handlePatientFieldChange, patientFieldRefs)
              );
            });
          }

          groupCard.appendChild(title);
          if (group.key === "medicare") {
            const switchRow = document.createElement("div");
            switchRow.className = "es-medicareModeSwitchRow";

            const switchLabel = document.createElement("label");
            switchLabel.className = "es-medicareSwitch";
            switchLabel.setAttribute("for", "es-medicareModeSwitch");
            switchLabel.innerHTML = `
              <input
                id="es-medicareModeSwitch"
                type="checkbox"
                class="es-medicareSwitch__input"
                role="switch"
                aria-label="I don't have a medicare"
              />
              <span class="es-medicareSwitch__track" aria-hidden="true">
                <span class="es-medicareSwitch__thumb"></span>
              </span>
              <span class="es-medicareSwitch__text">I don't have a medicare card</span>
            `;

            medicareModeSwitchInput = switchLabel.querySelector(".es-medicareSwitch__input");
            if (medicareModeSwitchInput) {
              medicareModeSwitchInput.checked = getMedicareMode(patient) === MEDICARE_MODE_NONE;
              medicareModeSwitchInput.addEventListener("change", () => {
                setMedicareMode(
                  medicareModeSwitchInput.checked ? MEDICARE_MODE_NONE : MEDICARE_MODE_HAVE
                );
              });
            }

            switchRow.appendChild(switchLabel);
            groupCard.appendChild(switchRow);

            const preview = createMedicarePreview();
            updateMedicarePreview = preview.update;
            groupCard.appendChild(preview.wrap);

            medicareHaveFieldsWrap = document.createElement("div");
            medicareHaveFieldsWrap.className = "es-patientFields es-medicareFieldsSet es-medicareFieldsSet--have";
            medicareHaveFieldsWrap.appendChild(
              buildPatientField("medicare", patient, handlePatientFieldChange, patientFieldRefs)
            );
            medicareHaveFieldsWrap.appendChild(
              buildPatientField(
                "medicare_reference_number",
                patient,
                handlePatientFieldChange,
                patientFieldRefs
              )
            );
            groupCard.appendChild(medicareHaveFieldsWrap);

            medicareAlternativeFieldsWrap = document.createElement("div");
            medicareAlternativeFieldsWrap.className =
              "es-patientFields es-medicareFieldsSet es-medicareFieldsSet--none";
            medicareAlternativeFieldsWrap.appendChild(
              buildSelectField(
                "medicare_provider",
                patient,
                handlePatientFieldChange,
                patientFieldRefs,
                {
                  label: "Provider",
                  placeholder: "Select a provider",
                  options: MEDICARE_PROVIDER_OPTIONS,
                }
              )
            );
            medicareAlternativeFieldsWrap.appendChild(
              buildPatientField(
                "health_identifier_number",
                patient,
                handlePatientFieldChange,
                patientFieldRefs
              )
            );
            groupCard.appendChild(medicareAlternativeFieldsWrap);
          }
          if (group.key !== "medicare") {
            groupCard.appendChild(fieldsWrap);
          }
          layout.appendChild(groupCard);
        });

        body.appendChild(layout);
        card.appendChild(body);
        syncMedicareModeUI();
        return card;
      }

      function renderStep(step) {
        if (step.type === "section") return renderSectionStep(step);
        if (step.type === "appointmentSelection") return renderAppointmentSelectionStep();
        if (step.type === "patientDetails") return renderPatientStep();

        const card = document.createElement("div");
        card.className = "es-stepCard";
        card.innerHTML = `<div class="es-stepBody"><div class="es-error">Unknown step.</div></div>`;
        return card;
      }

      function hasSelectedOption(q) {
        const selectedAnswers = (q.answers || []).filter((a) => !!a.selected).length;
        const otherSelected = q?.other?.enabled && q?.other?.selected ? 1 : 0;
        return selectedAnswers + otherSelected;
      }

      function validateCurrentStep() {
        const step = state.steps[state.index];
        if (!step) return true;

        if (step.type === "appointmentSelection") {
          const p = state.answers.patient || {};
          if (!String(p.practitioner_id || "").trim()) {
            alert("Please select a practitioner.");
            return false;
          }
          if (!String(p.appointment_start || "").trim()) {
            alert("Please select an appointment time.");
            return false;
          }
          if (p.appointment_date && !isValidDateYmd(String(p.appointment_date))) {
            alert("Appointment date must be YYYY-MM-DD.");
            return false;
          }
          return true;
        }

        if (step.type === "section") {
          const sec = state.answers.content.sections[step.sectionIndex];
          for (const q of sec.questions || []) {
            if (!q.required) continue;

            if (q.type === "checkboxes" || q.type === "radiobuttons") {
              const total = hasSelectedOption(q);
              if (total === 0) {
                alert(`Please select at least one option for: ${q.name}`);
                return false;
              }
              if (q.type === "radiobuttons" && total > 1) {
                alert(`Please select only one option for: ${q.name}`);
                return false;
              }
              if (q?.other?.enabled && q.other.selected && !String(q.other.value || "").trim()) {
                alert(`Please provide "Other" value for: ${q.name}`);
                return false;
              }
            } else {
              if (!String(q.answer || "").trim()) {
                alert(`Please answer: ${q.name}`);
                return false;
              }
            }
          }
          return true;
        }

        if (step.type === "patientDetails") {
          const p = normalizePatientForBackend(state.answers.patient || {});

          for (const field of REQUIRED_PATIENT_FIELDS) {
            if (!String(p[field] || "").trim()) {
              alert(`${prettifyPatientKey(field)} is required.`);
              return false;
            }
          }

          if (!EMAIL_RE.test(String(p.email || ""))) {
            alert("Please enter a valid email.");
            return false;
          }

          const medicareMode = getMedicareMode(p);
          if (medicareMode === MEDICARE_MODE_NONE) {
            if (!String(p.medicare_provider || "").trim()) {
              alert("Please select a provider.");
              return false;
            }

            if (!/^\d{16}$/.test(String(p.health_identifier_number || ""))) {
              alert("HIN must contain exactly 16 numbers.");
              return false;
            }
          } else {
            if (!/^\d{10}$/.test(String(p.medicare || ""))) {
              alert("Medicare must contain exactly 10 digits (e.g. 1234 56789 0).");
              return false;
            }

            if (!/^\d$/.test(String(p.medicare_reference_number || ""))) {
              alert("IRN must be one digit from 0 to 9.");
              return false;
            }
          }

          if (p.date_of_birth && !isValidDateYmd(String(p.date_of_birth))) {
            alert("Date of birth must be a valid date.");
            return false;
          }

          if (isNextAvailableMode()) {
            // In next_available mode, appointment fields are resolved asynchronously.
            const hasPractitioner = !!String(p.practitioner_id || "").trim();
            const hasAppointmentStart = !!String(p.appointment_start || "").trim();
            if ((!hasPractitioner || !hasAppointmentStart) && state._nextAvailableAuto?.status === "error") {
              const detail =
                state._nextAvailableAuto?.error?.message ||
                "Unable to auto-select next available time.";
              alert(detail);
              return false;
            }
          }

          if (!getCurrentModuleId()) {
            alert("Module ID is missing.");
            return false;
          }

          if (!getCurrentPatientFormTemplateId()) {
            alert("Patient form template ID is missing.");
            return false;
          }
        }

        return true;
      }

      function isPatientDetailsStep(step) {
        return step?.type === "patientDetails";
      }

      function isPaymentSubmissionStep(step) {
        if (isNextAvailableMode()) {
          return isPatientDetailsStep(step);
        }

        return step?.type === "appointmentSelection";
      }

      async function renderWithTransition(opts) {
        const animate = !!opts?.animate;

        if (state.isRendering) return;
        state.isRendering = true;

        if (state.paymentActive) {
          syncShellVisibility();
          state.isRendering = false;
          return;
        }

        if (!state.steps.length) {
          ui.root.innerHTML = `<div class="es-stepCard"><div class="es-error">No steps found.</div></div>`;
          state.isRendering = false;
          return;
        }

        state.index = Math.max(0, Math.min(state.index, state.steps.length - 1));
        const step = state.steps[state.index];
        applyCurrentStepData(step);

        setShellHeaderTitle(step?.title || "");

        const existing = ui.root.querySelector(".es-stepCard");
        const doAnim = animate && !prefersReducedMotion;

        if (doAnim && existing) {
          existing.classList.add("es-step-exit");
          await sleep(160);
        }

        ui.root.innerHTML = "";
        const card = renderStep(step);
        if (card?.dataset) {
          card.dataset.esStep = String(step?.key || step?.type || "");
          card.dataset.esStepKey = String(step?.key || "");
          card.dataset.esStepType = String(step?.type || "");
          card.dataset.esStepIndex = String(state.index);
        }

        if (doAnim) card.classList.add("es-step-enter");
        ui.root.appendChild(card);

        if (doAnim) {
          requestAnimationFrame(() => card.classList.add("es-step-enter-active"));
          setTimeout(() => {
            card.classList.remove("es-step-enter");
            card.classList.remove("es-step-enter-active");
          }, 240);
        }

        setProgress(state.index, state.steps.length);

        ui.back.disabled = state.index === 0;

        const isLast = state.index === state.steps.length - 1;
        ui.next.classList.toggle("es-hidden", isLast);
        ui.submit.classList.toggle("es-hidden", !isLast);
        ui.submit.textContent = isLast && isPaymentSubmissionStep(step) ? "Continue to payment" : "Submit";

        syncShellVisibility();
        state.isRendering = false;
        requestAnimationFrame(triggerConditionals);
      }

      function render(animate) {
        return renderWithTransition({ animate: !!animate });
      }

      function clampStepIndex(index) {
        const maxIndex = Math.max(0, state.steps.length - 1);
        const numeric = Number(index);
        if (!Number.isFinite(numeric)) return state.index;
        return Math.max(0, Math.min(Math.round(numeric), maxIndex));
      }

      function getFirstSectionStepIndex() {
        const index = state.steps.findIndex((step) => step?.type === "section");
        return index >= 0 ? index : 0;
      }

      function getAppointmentSelectionStepIndex() {
        return state.steps.findIndex((step) => step?.type === "appointmentSelection");
      }

      function getPatientDetailsStepIndex() {
        return state.steps.findIndex((step) => step?.type === "patientDetails");
      }

      function getPreferredRetrievedDataStepIndex() {
        const appointmentIndex = getAppointmentSelectionStepIndex();
        if (appointmentIndex >= 0) return appointmentIndex;

        const patientIndex = getPatientDetailsStepIndex();
        if (patientIndex >= 0) return patientIndex;

        return getFirstSectionStepIndex();
      }

      function rebuildShellSteps() {
        state.steps = buildStepsFromTemplate(state.answers, {
          appointmentMode: state.appointmentMode,
        });
      }

      function getBridgeState() {
        return {
          index: state.index,
          paymentActive: !!state.paymentActive,
          step: deepClone(state.steps[state.index] || null),
          steps: deepClone(state.steps || []),
          answers: deepClone(state.answers || {}),
          payload: buildPayload(state),
        };
      }

      async function goToStepIndex(targetIndex, opts = {}) {
        const animate = opts?.animate !== false;
        const shouldScroll = opts?.scroll !== false;

        if (state.paymentActive) {
          hidePayment();
        }

        if (shouldScroll) scrollStepRootToTop();
        state.index = clampStepIndex(targetIndex);
        await render(animate);
        if (shouldScroll) {
          scrollStepRootToTop();
          setTimeout(() => scrollStepRootToTop(), 120);
        }

        return state.index;
      }

      function setPatientAnswers(patientPatch = {}, opts = {}) {
        if (!state.answers.patient || typeof state.answers.patient !== "object") {
          state.answers.patient = {};
        }

        state.answers.patient = {
          ...state.answers.patient,
          ...deepClone(patientPatch || {}),
        };

        if (opts?.sync !== false) {
          syncPayloadExposure();
        }

        return deepClone(state.answers.patient);
      }

      function setFormSections(sections = [], opts = {}) {
        if (!state.answers.content || typeof state.answers.content !== "object") {
          state.answers.content = { sections: [] };
        }

        state.answers.content.sections = Array.isArray(sections)
          ? deepClone(sections)
          : [];

        rebuildShellSteps();

        if (opts?.sync !== false) {
          syncPayloadExposure();
        }

        return deepClone(state.answers.content.sections);
      }

      async function setFormTemplate(templateId, opts = {}) {
        const normalized = String(templateId || "").trim();
        if (!normalized) return false;

        state.answers.patient_form_template_id = normalized;
        if (window.formHandlerData && typeof window.formHandlerData === "object") {
          window.formHandlerData.patient_form_template_id = normalized;
        }

        if (
          window.ClinikoHeadlessCalendar &&
          typeof window.ClinikoHeadlessCalendar.updateFormtemplate === "function"
        ) {
          try {
            await window.ClinikoHeadlessCalendar.updateFormtemplate(normalized);
          } catch (err) {
            console.error("[ES Headless] Failed to update form template.", err);
            return false;
          }
        }

        if (opts?.sync !== false) {
          syncPayloadExposure();
        }

        return true;
      }

      async function applyRetrievedData(data, opts = {}) {
        const payload = data?.prefill || null;
        if (!payload || typeof payload !== "object") {
          return { ok: false, message: "Invalid retrieved data." };
        }

        const mode = String(opts?.mode || "use").trim().toLowerCase() === "update"
          ? "update"
          : "use";
        const shouldNavigate = opts?.navigate !== false;
        const animate = opts?.animate !== false;

        const currentModuleId = String(window.formHandlerData?.module_id || "").trim();
        const historyModuleId = String(payload?.history?.appointment_type_id || "").trim();
        const latestFormTemplateId = String(data?.latest_form?.patient_form_template_id || "").trim();

        const patientPatch =
          payload?.patient && typeof payload.patient === "object"
            ? deepClone(payload.patient)
            : {};

        if (historyModuleId && currentModuleId && historyModuleId !== currentModuleId) {
          patientPatch.practitioner_id = "";
        }

        patientPatch.appointment_start = "";
        patientPatch.appointment_date = "";

        if (latestFormTemplateId) {
          const changed = await setFormTemplate(latestFormTemplateId, { sync: false });
          if (!changed) {
            return { ok: false, message: "Unable to update form template." };
          }
        }

        setPatientAnswers(patientPatch, { sync: false });
        setFormSections(payload?.content?.sections || [], { sync: false });
        syncPayloadExposure();

        let targetStepIndex = state.index;
        if (shouldNavigate) {
          targetStepIndex =
            mode === "update"
              ? getFirstSectionStepIndex()
              : getPreferredRetrievedDataStepIndex();
          await goToStepIndex(targetStepIndex, { animate, scroll: true });
        }

        return {
          ok: true,
          mode,
          targetStepIndex,
          payload: buildPayload(state),
        };
      }

      async function enterPaymentStep(opts = {}) {
        if (opts?.validate !== false && !validateCurrentStep()) {
          return { ok: false, reason: "validation_failed" };
        }

        if (opts?.sync !== false) {
          syncPayloadExposure();
        }

        if (opts?.scroll !== false) {
          scrollStepRootToTop(true);
        }

        showPayment();

        if (opts?.scroll !== false) {
          setTimeout(() => scrollStepRootToTop(true), 120);
        }

        return { ok: true };
      }

      function installHeadlessBridge() {
        window.ClinikoHeadlessBridge = {
          getState: () => getBridgeState(),
          syncPayload: () => {
            syncPayloadExposure();
            return buildPayload(state);
          },
          render: (animate = false) => render(!!animate),
          goToStep: (index, opts = {}) => goToStepIndex(index, opts),
          goToFirstStep: (opts = {}) => goToStepIndex(getFirstSectionStepIndex(), opts),
          goToAppointmentStep: (opts = {}) => goToStepIndex(getPreferredRetrievedDataStepIndex(), opts),
          showShell: () => {
            state.shellSuppressed = false;
            syncShellVisibility();
            return true;
          },
          hideShell: () => {
            state.shellSuppressed = true;
            syncShellVisibility();
            return true;
          },
          showPayment: () => {
            showPayment();
            return true;
          },
          hidePayment: () => {
            hidePayment();
            return true;
          },
          enterPaymentStep: (opts = {}) => enterPaymentStep(opts),
          setFormTemplate: (templateId, opts = {}) => setFormTemplate(templateId, opts),
          setPatientAnswers: (patientPatch, opts = {}) => setPatientAnswers(patientPatch, opts),
          setFormSections: (sections, opts = {}) => setFormSections(sections, opts),
          applyRetrievedData: (data, opts = {}) => applyRetrievedData(data, opts),
        };

        document.dispatchEvent(
          new CustomEvent("es:headless:bridge-ready", {
            detail: { bridge: window.ClinikoHeadlessBridge },
          })
        );
      }

      async function goNext() {
        if (!validateCurrentStep()) return;

        const nextIndex = Math.min(state.index + 1, state.steps.length - 1);
        const nextStep = state.steps[nextIndex];
        if (nextStep?.type === "patientDetails" && isNextAvailableMode()) {
          // Start fetching in background to avoid blocking Next navigation.
          void ensureAutoNextAvailableSelection({ forceRefresh: true, silent: true });
        }

        scrollStepRootToTop();
        state.index = nextIndex;
        await render(true);
        scrollStepRootToTop();
        setTimeout(() => scrollStepRootToTop(), 120);
      }

      async function goBack() {
        scrollStepRootToTop();
        state.index = Math.max(state.index - 1, 0);
        await render(true);
        scrollStepRootToTop();
        setTimeout(() => scrollStepRootToTop(), 120);
      }

      function onSubmitClick() {
        const step = state.steps[state.index];

        (async () => {
          if (state.index === state.steps.length - 1 && isPaymentSubmissionStep(step)) {
            if (isNextAvailableMode()) {
              // Refresh in background; submitBookingForm wrapper enforces readiness before booking.
              void ensureAutoNextAvailableSelection({ forceRefresh: true, silent: true });
            }

            if (!validateCurrentStep()) return;
            syncPayloadExposure();
            // Always use window top scroll before entering payment (desktop and mobile).
            scrollStepRootToTop(true);
            showPayment();
            setTimeout(() => scrollStepRootToTop(true), 120);
            return;
          }

          console.log("Headless payload:", window.clinikoGetHeadlessPayload());
        })();
      }

      ui.back.addEventListener("click", goBack);
      ui.next.addEventListener("click", goNext);
      ui.submit.addEventListener("click", onSubmitClick);

      installHeadlessBridge();
      syncShellVisibility();
      render(false);
    }
  })();
</script>
